#  Lexington bicycle Level of Traffic Stress — all tunable parameters.
#
#  This file is the single source of truth for the LTS rules. It is serialized
#  verbatim into data/methodology.json at build time, so the published
#  methodology can never drift from the rules that were actually executed.
#
#  Override any value from the command line for sensitivity runs:
#      python -m lexbike build --set mixed.speed_35_lts=2 --out data/sens_a

[meta]
# Bumped by hand when a rule change makes previously published numbers stale.
ruleset_version = "2.0.0"
crs_working = 32616          # UTM 16N — metres, correct for Kentucky
crs_output = 4326
coord_decimals = 5           # ~0.87 m at 38°N; see docs/sensitivity.md


# ---------------------------------------------------------------------------
#  Facility classification
# ---------------------------------------------------------------------------
#
#  IMPORTANT — only Type_Facility is used.
#
#  Bicycle_Network_Master.geojson carries three facility-ish columns:
#
#    Type_Facility     the physical facility that exists on the ground
#    Name_Facility     a Status-prefixed restatement of Type_Facility; it agrees
#                      1:1 (EXISTING ROAD SHOULDER <-> Shoulder, 9/9;
#                      EXISTING PREFERRED ROUTE <-> Preferred Route, 207/207)
#    AltType_Facility  a corridor/network designation or RECOMMENDED upgrade —
#                      *not* infrastructure that exists
#
#  Reading AltType as a facility would be wrong. Concretely it would invent
#  37 bike lanes on Redding Rd (Type=Preferred Route, Alt=Bicycle Lane, but
#  Name_Facility='EXISTING PREFERRED ROUTE'), and would promote 7 road
#  shoulders and 18 bike lanes to LTS 1 shared-use paths via
#  Alt='Shared Use Trail' on segments whose Type_Road is 'On Road'.
#
#  AltType is still valuable — it encodes the recommended treatment per
#  corridor — but it belongs to the scenario/planning feature, not to a
#  rating of what exists today. See [scenario].

[facility.type_map]
# Every distinct Type_Facility value in the source must appear here.
# An unrecognized value raises rather than silently degrading to "none",
# so a future LFUCG data update fails loudly.
"Shared Use Path"       = "path"
"Buffered Bicycle Lane" = "buffered"
"Bicycle Lane"          = "lane"
"Shoulder"              = "shoulder"
"Sharrow"               = "sharrow"
"Preferred Route"       = "none"      # signed wayfinding only; no treatment

# Protective ordering, used when several facilities conflate onto one
# centreline. Higher wins.
[facility.rank]
none      = 0
sharrow   = 1
shoulder  = 2
lane      = 3
buffered  = 4
protected = 5   # no existing segment in Lexington; retained for future data
path       = 6
connector  = 7  # synthetic edge joining an off-road path to the street network


# ---------------------------------------------------------------------------
#  Road classification
# ---------------------------------------------------------------------------
[rdclass]
prohibited = [1, 2]              # Interstate, Parkway/Expressway — bikes barred
# One source row has RDCLASS 69 (W HICKMAN PLANT RD, SPEED 25, CartoClass 4);
# an obvious typo for 6. Normalized with a logged warning.
typo_fixes = { 69 = 6 }

[rdclass.labels]
1 = "Interstate / Highway"
2 = "Parkway / Expressway"
3 = "Arterial"
4 = "Major Collector"
5 = "Minor Collector"
6 = "Local Street"
7 = "Service Road"
8 = "Alley"


# ---------------------------------------------------------------------------
#  Lane-count surrogate
# ---------------------------------------------------------------------------
#
#  No lane count exists in any source, so this is an explicitly documented
#  surrogate, shipped to the browser as a property so it stays auditable.
#
#  The subtlety: ONEWAY != 'B' means opposite things by road class. On
#  arterials it is 817 of 1,091 segments — divided roads digitized as two
#  centrelines, i.e. MORE lanes. On local streets it is 810 of 11,420 —
#  genuine downtown one-ways, i.e. FEWER lanes.

[lanes]
default = 2

[[lanes.rules]]
rdclass = [3]
oneway = "directional"
lanes = 3            # one direction of a divided arterial

[[lanes.rules]]
rdclass = [3]
oneway = "both"
cartoclass = [1, 2]
lanes = 5            # major undivided arterial

[[lanes.rules]]
rdclass = [3]
oneway = "both"
lanes = 3

[[lanes.rules]]
rdclass = [4]
oneway = "directional"
lanes = 2

[[lanes.rules]]
rdclass = [4]
oneway = "both"
lanes = 3

[[lanes.rules]]
rdclass = [5, 6, 7, 8]
oneway = "directional"
lanes = 1

[[lanes.rules]]
rdclass = [5, 6, 7, 8]
oneway = "both"
lanes = 2


# ---------------------------------------------------------------------------
#  Traffic volume (AADT)
# ---------------------------------------------------------------------------
[aadt]
# KYTC station ids carry a 3-digit county prefix. Keying on the last three
# characters rather than stripping a hardcoded '034' also picks up the
# records prefixed 105/057/025.
station_key_chars = 3
# Fallback cascade for the ~11,700 segments with no count station.
impute_groups = [
  ["RDCLASS", "CartoClass", "MAINTENANCE"],
  ["RDCLASS", "CartoClass"],
  ["RDCLASS"],
]
impute_floor = 500

# KYTC only counts a biased subset of roads. A validated gradient-boosting
# model is used for represented road classes/categories; the median cascade
# remains the fallback for neighbourhood streets and out-of-domain values.
# Segments resting on a coarse imputation ship with cf=0 (low confidence).
bias_note = """KYTC traffic counts exist only on state-maintained routes. \
Where count coverage is representative, estimates use a route-group validated \
gradient-boosting model; local streets retain class-median estimates. Neither \
kind of estimate is a measurement."""

[aadt.model]
enabled = true
# Classes 6-8 are predominantly neighbourhood, private or service streets and
# are badly underrepresented in KYTC counts. Using the model there predicts the
# count programme's selection bias rather than local traffic.
eligible_rdclasses = [1, 2, 3, 4, 5]
min_station_keys = 100
min_category_station_keys = 5
max_aadt = 110000
cv_folds = 5
# Predict the conditional 75th percentile rather than the median. On held-out
# routes this halves dangerous low-bin errors (3.1% vs 6.4%) while retaining a
# lower RMSLE than the class-median fallback.
quantile = 0.75
max_iter = 250
learning_rate = 0.05
max_leaf_nodes = 15
min_samples_leaf = 12
l2_regularization = 2.0
random_state = 42


# ---------------------------------------------------------------------------
#  Known coverage gap in the source street data
# ---------------------------------------------------------------------------
#
#  LFUCG's centreline file does not contain every street. Measured against
#  OpenStreetMap in three sampled areas (Kenwick, UK/south, north Lexington),
#  22 of 375 named non-service streets were absent -- 3% to 8% by area.
#  White Ave, Commonwealth Dr and Brooks St are examples. Commonwealth Dr is
#  now a reviewed exception imported below; the general limitation remains.
#
#  This is disclosed rather than filled. Importing OSM geometry would supply
#  the shape of a missing street but none of its posted speed or road class,
#  so it could not be rated: assuming a comfortable rating invents one, and
#  assuming a stressful rating leaves the router avoiding it exactly as it does
#  now. It would also reintroduce the two-differently-noded-networks problem
#  that the centreline-canonical design exists to remove.
#
#  The practical effect is that a route may detour around a street that exists.

[coverage]
sampled_areas = 3
osm_named_streets = 375
missing_from_lfucg = 22
note = """LFUCG's street file is missing about 6% of named streets (measured \
against OpenStreetMap across three sampled areas). Most missing streets cannot \
be rated or routed over, so a route may occasionally detour around one that \
exists; individually reviewed exceptions are disclosed with the OSM supplement."""


# ---------------------------------------------------------------------------
#  LTS thresholds
# ---------------------------------------------------------------------------
#
#  Scale is 0-4. There is no LTS 5: Furth/Mekuria define 1-4, and the old
#  code's "LTS 5" conflated two different things. Split here into
#      lts = 0  bikes legally prohibited (Interstate/Parkway)
#      lts = 4  legal but high stress (an arterial with no facility)

[lts]
low_stress_max = 2          # "comfortable for most adults" — the network threshold

# Mixed traffic: no facility, or sharrows (which the literature treats as
# equivalent to no facility).
[lts.mixed]
speed_25_aadt_750_lts = 1   # requires lanes <= 2
speed_25_aadt_3000_lts = 2
speed_25_else_lts = 3
speed_30_aadt_3000_lts = 2
speed_30_else_lts = 3
speed_35_lts = 3            # LOCKED: Mekuria/Furth Table 8. The single
                            # highest-leverage parameter in the model.
                            # MEASURED: setting this to 2 moves the largest
                            # island from 111.0 mi (12.0%) to 586.9 mi (52.9%)
                            # and changes 1,591 segments. Read
                            # docs/sensitivity.md before touching it.
speed_40_plus_lts = 4
lanes_4_5_speed_30_lts = 3
lanes_4_5_else_lts = 4
lanes_6_plus_lts = 4
aadt_break_low = 750
aadt_break_mid = 3000

[lts.path]
lts = 1

[lts.protected]
lts = 1

[lts.buffered]
speed_30_lanes_2_lts = 1
speed_35_lts = 2
else_lts = 3

[lts.lane]
speed_30_lts = 2
speed_35_lts = 3
else_lts = 4
wide_road_penalty = 1       # +1 LTS when lanes >= 4, capped at 4
wide_road_lanes = 4

[lts.shoulder]
speed_35_lts = 3
else_lts = 4

[lts.connector]
lts = 1                     # short, visible, dashed; see [conflation].connector_max_m

[lts.labels]
# Plain language first — this is a public map. The numeric LTS is secondary.
0 = { short = "Bikes not permitted", detail = "Interstate or parkway" }
1 = { short = "Relaxed",                     detail = "Good for kids and new riders" }
2 = { short = "Comfortable for most adults", detail = "Quiet streets and bike lanes" }
3 = { short = "Busy",                        detail = "For confident riders" }
4 = { short = "Stressful",                   detail = "Experienced riders only" }


# ---------------------------------------------------------------------------
#  Conflation: bike facilities -> street centrelines
# ---------------------------------------------------------------------------
#
#  The LFUCG centreline layer is the one canonical network (13,775 features,
#  already exactly noded — 99.7% of nodes in a single component). The bike
#  layer is an independently digitized overlay sharing almost no nodes with
#  it: only 241 of its 1,056 endpoints land within 1 m of a centreline
#  endpoint. So on-road facilities become centreline ATTRIBUTES; only
#  off-road paths keep their own geometry.

[conflation]
buffer_m = 12.0
# A facility corridor is often digitized once between two one-way carriageways.
# When its Name_Network exactly matches the LFUCG road name, this narrowly
# larger reach lets both directions inherit the facility. Beaumont Centre
# Circle's carriageways are 12.2-12.7 m from the single buffered-lane record,
# just outside the ordinary geometric tolerance.
named_corridor_buffer_m = 16.0
min_coverage = 0.55            # share of a centreline that must be covered
bearing_tolerance_deg = 30.0
exclude_rdclass = [1, 2]       # never conflate a facility onto an interstate

# A category must contribute this share of the *covered* length to be eligible
# to label the block. Without it, a buffer that merely clips the end of a block
# (contributing ~0 m) decides that block's rating.
min_category_share = 0.30

# Quality gate. Deliberately NOT "conflated miles must equal source miles":
# facility segments have a median length of 626 m against 118 m centrelines, so
# a facility is credited to whole blocks and legitimately yields more
# block-mileage than facility-mileage. Demanding equality would force the
# thresholds to throw away real facilities.
#
#   recall     fraction of treated facility length lying within the buffer of a
#              credited centreline. Low means we dropped facilities.
#   inflation  credited centreline miles / treated facility miles. High means we
#              credited whole arterials off incidental contact.
min_recall = 0.90
max_inflation = 1.45

connector_max_m = 25.0         # 162 of 254 off-road endpoints connect at 25 m
# Separate paths may be independently digitized a few metres apart at a real
# junction. Keep this much tighter than the street reach: on a dense campus,
# using 25 m between paths manufactures links across lawns and between parallel
# sidewalks.
path_connector_max_m = 8.0

# Minimum gap between interior attachment points along one path. The closest
# eligible target at each endpoint is always retained, even inside this window,
# because endpoints are the obvious entrances and exits.
attach_spacing_m = 120.0

# Merge only attachment geometries that land at effectively the same place.
attach_merge_m = 0.75

# No path edge may exceed this. Attachment points only appear where a path meets
# something else, so a rural trail can still run for miles as one edge -- and a
# route travelling along it could only leave at its ends. Subdividing gives the
# router somewhere to turn off. OSM's longest imported way was 7.5 mi.
max_path_edge_m = 800.0

# The city bike layer represents this continuous lane with one centreline, but
# Shropshire splits into two one-way LFUCG street centrelines around this block.
# Both diverge too far from the independently digitized facility line to pass
# the normal 16 m / 55% match. Scope the correction to the audited source and
# target ids; a source/type/name change or a target farther than 30 m fails the
# build instead of silently applying stale local knowledge.
[[conflation.reviewed_on_road_assignments]]
name = "Shropshire Avenue split carriageways"
source_id = 106
facility = "lane"
street_ids = [13616, 13617]
street_name = "Shropshire Ave"
max_distance_m = 30.0
why = "LFUCG record 106 says the existing bike lane continues from E Fifth St to past E Sixth St."

# Individually reviewed campus cut-throughs that are longer than the ordinary
# 25 m verge/curb connector. These remain explicit so a global tolerance change
# cannot manufacture similar shortcuts elsewhere. The source coordinate only
# identifies an existing path endpoint; the street end is projected onto the
# named LFUCG centreline and that centreline is split into a real graph node.
[[conflation.reviewed_connectors]]
name = "UK Fine Arts Trail to South Mill Street"
source = [-84.50717, 38.04241]
target_street = "S MILL ST"
max_m = 90.0

[[conflation.reviewed_connectors]]
name = "Sellers Alley cycleway to Scott Street"
source = [-84.50949, 38.04007]
target_street = "SCOTT ST"
max_m = 90.0


# ---------------------------------------------------------------------------
#  Connectivity
# ---------------------------------------------------------------------------
[network]
# No grid snapping. Centreline endpoints are already exactly coincident, so
# nodes come from equality of rounded coordinates. The old snap_to_grid rounded
# each coordinate to a multiple of the tolerance, which put endpoints 0.1 m
# apart into different cells while merging points 11 m apart on a diagonal --
# it manufactured islands in both directions.
#
# Node identity deliberately uses meta.coord_decimals, the SAME precision the
# geometry is exported at. If the graph noded more finely than it exported, the
# browser would render two lines visibly touching that the graph calls separate.
min_cluster_segments = 3
barrier_min_island_segments = 3


# ---------------------------------------------------------------------------
#  Supplementary paths from OpenStreetMap
# ---------------------------------------------------------------------------
#
#  Enabled for the public build. A failed or out-of-range OSM fetch stops the
#  deployment, so the live map cannot silently fall back to LFUCG-only data.
#
#  The Fayette County query supplies cycleways and bicycle-designated paths.
#  A reviewed four-street polygon supplies non-private walkways only within
#  UK's academic core; UK permits bicycles there even when OSM has no
#  bicycle-specific tag.
#
#  This is importable where OSM *streets* are not. A path separated from traffic
#  is LTS 1 by definition, which is already how LFUCG paths are rated, so
#  nothing has to be inferred and nothing is conflated onto a centreline.
#  Untagged footways outside the academic core remain excluded: almost all are
#  ordinary sidewalks and have not received the same local review.
#
#  LICENSING: OpenStreetMap is ODbL. The map carries permanent attribution and
#  the published derived data remains openly downloadable.

[osm]
enabled = true
overpass_url = "https://overpass-api.de/api/interpreter"
# Fayette County, Kentucky. Selecting on the name alone also matches Fayette
# counties in several other states; the stable OSM relation id is unambiguous.
relation_id = 130537
# Locally reviewed false positive: OSM maps a bicycle-designated sidewalk
# across the Alumni Drive bridge over New Circle Road, but that bicycle
# crossing is not present. Keep the exclusion tied to the exact OSM way so it
# cannot suppress nearby paths or future, independently mapped construction.
excluded_way_ids = [1014019527]
# University of Kentucky campus multipolygon, retained as provenance for the
# enclosing campus. Generic walkways are imported only inside the academic-core
# polygon below.
campus_relation_id = 4815526
# UK defines the academic core as bounded by Rose Street, Washington Avenue,
# South Limestone Street and Avenue of Champions. Clockwise corners follow
# those four LFUCG street corridors. Geometry is clipped to this polygon after
# download, so a way crossing the boundary cannot bring its outside tail along.
academic_core_polygon = [
  [-84.5080283, 38.0357406], # S Limestone / Washington Ave
  [-84.5051538, 38.0342349], # east end of Washington at the Rose corridor
  [-84.4997921, 38.0378381], # Rose St / Avenue of Champions
  [-84.5038474, 38.0415376], # Avenue of Champions / S Limestone
]
academic_core_boundary_source = "UK academic core: Rose Street, Washington Avenue, S Limestone Street, and Avenue of Champions"
fetch_timeout_s = 150
fetch_attempts = 3

# A way is a duplicate when most of its length runs inside a buffer around the
# existing off-road network. Length-based, so a trail digitized with different
# vertices still matches.
dedupe_buffer_m = 15.0
dedupe_max_overlap = 0.5
access_dedupe_buffer_m = 8.0
access_search_radius_m = 750

# The reviewed Baptist Health internal-access corridor has explicit bicycle
# permission. Rate it LTS 2, but do not advertise or count it as a dedicated
# bike facility.
access_lts = 2

# Commonwealth Drive is absent from LFUCG but has been locally reviewed as a
# 25 mph residential corridor. Import its OSM geometry at LTS 1, plus only the
# short University Court approach needed to join its west end to the existing
# LFUCG graph. Neither street is advertised or counted as a bike facility.
reviewed_street_lts = 1
required_reviewed_street_names = ["Commonwealth Drive"]
reviewed_street_connector_names = ["University Court"]

# Refuse an import wildly outside what was measured, so a bad Overpass day or an
# edit war cannot silently swing the "bike network" between builds.
expect_min_miles = 10.0
expect_max_miles = 40.0
# The academic core contains roughly 8.5 raw walkway miles; LFUCG overlap
# removal lowers the published total. This gate catches an empty/partial
# response or an accidentally broadened query.
expect_min_campus_path_miles = 3.0
expect_max_campus_path_miles = 12.0
expect_min_access_miles = 0.3
expect_max_access_miles = 2.0
expect_min_reviewed_street_miles = 0.6
expect_max_reviewed_street_miles = 1.0

# This is the two-way Baptist Health cut-through that motivated importing
# explicitly bicycle-authorized service roads. If it disappears upstream or is
# accidentally filtered, keep the last good public map rather than regress.
required_access_names = ["Baptist Health Entrance 1"]

attribution = "Supplementary paths © OpenStreetMap contributors, ODbL"


# ---------------------------------------------------------------------------
#  Routing preferences
# ---------------------------------------------------------------------------
[routing]
# A campus walkway is secondary only where it runs alongside on-road bicycle
# infrastructure. Interior campus paths and useful cut-throughs keep their
# ordinary LTS 1 cost.
campus_bike_near_m = 30.0
campus_bike_parallel_degrees = 30.0
campus_bike_min_parallel_share = 0.50
# Strong enough for an LTS 1 walkway to yield to a somewhat longer LTS 2 bike
# facility. Fastest remains literal shortest distance and ignores this factor.
campus_parallel_bike_factor = 1.50


# ---------------------------------------------------------------------------
#  Council districts
# ---------------------------------------------------------------------------
#
#  Read from LFUCG's published layer on every build rather than copied into
#  this repository. Council members change with elections, and a hardcoded
#  address would keep working long after it had become wrong -- quietly sending
#  constituent mail to someone who no longer holds the seat.
#
#  The layer carries DISTRICT, REP, EMAIL, TELEPHONE and URL for all 12 seats.
#  A failed fetch degrades: segments carry no district and the map falls back
#  to the council's general contact page.

[council]
source_url = "https://opendata.arcgis.com/datasets/5bab826b97c84d229f7abf0bc947981c_0.geojson"
fetch_timeout_s = 45
# Shown when no district could be determined, or the roster is unavailable.
fallback_url = "https://www.lexingtonky.gov/council-members"
fallback_label = "Find your council member"


# ---------------------------------------------------------------------------
#  Export / frontend data contract
# ---------------------------------------------------------------------------
[export]
# Simplification tolerance in degrees. The priority layer is the hero data and
# is barely simplified; the residential bulk is background context where ~3 m is
# invisible at the zooms it renders at.
simplify_priority = 0.00001
simplify_residential = 0.00003

# Budgets in KB, checked against the GZIPPED size at build time so a schema
# regression cannot quietly reintroduce a multi-megabyte payload. The old
# index.html shipped 904 KB gzipped with every byte on the critical path.
[export.budget_kb]
"network.geojson" = 90         # critical path: built facilities only
"context.geojson" = 200        # busy/prohibited roads, fetched right after
"residential.geojson" = 420    # quiet streets, deferred to idle or z>=13
# Raised from 200 when off-road paths gained interior junctions. The graph grew
# because it became correct: trails were previously single edges enterable only
# at their extremities, so 34 of 39 path miles were unusable for anything but
# end-to-end travel.
"graph.json" = 250
"planned.geojson" = 20
"council.json" = 6
"islands.json" = 30
"gaps.json" = 60
"stats.json" = 8
"methodology.json" = 12
"manifest.json" = 2

# Budgets that apply when osm.enabled -- supplementary OSM paths, including
# UK academic-core walkways, land in the critical-path layer. Kept
# separate so the default build still fails if it creeps past its own, much
# tighter, limit.
[export.budget_kb_osm]
"network.geojson" = 250
"graph.json" = 340


# ---------------------------------------------------------------------------
#  Scenario / planned projects
# ---------------------------------------------------------------------------
[scenario]
# Status == 'Funded' (26 segments) drives the "if these get built" toggle.
funded_status = "Funded"
existing_status = "Existing"
# AltType_Facility, which is NOT used for rating what exists, IS the right
# source for the recommended treatment on a corridor.
use_alttype_as_recommendation = true


# ---------------------------------------------------------------------------
#  Confidence
# ---------------------------------------------------------------------------
[confidence]
# 2 high / 1 medium / 0 low. A segment also drops to 0 when its LTS flips
# under any variant of the sensitivity sweep — the honest definition of
# "uncertain", computed mechanically rather than asserted.
high_requires_station = true
sensitivity_flip_forces_low = true


# ---------------------------------------------------------------------------
#  Sensitivity sweep
# ---------------------------------------------------------------------------
[[sensitivity.runs]]
name = "mixed_35mph_as_lts2"
set = { "lts.mixed.speed_35_lts" = 2 }
why = "Dominant parameter: tests whether unprotected 35 mph streets are LTS 2 or LTS 3."

[[sensitivity.runs]]
name = "aadt_break_2000"
set = { "lts.mixed.aadt_break_mid" = 2000 }
why = "995 imputed RDCLASS-5 segments at 25 mph hinge on this threshold."

[[sensitivity.runs]]
name = "aadt_break_5000"
set = { "lts.mixed.aadt_break_mid" = 5000 }
why = "Upper bound on the same question."

[[sensitivity.runs]]
name = "conflation_buffer_8m"
set = { "conflation.buffer_m" = 8.0 }
why = "Lower bound on the ordinary geometric buffer; the recall gate must still pass."

[[sensitivity.runs]]
name = "conflation_buffer_20m"
set = { "conflation.buffer_m" = 20.0 }
why = "Upper bound on conflation aggressiveness."

[[sensitivity.runs]]
name = "connector_15m"
set = { "conflation.connector_max_m" = 15.0 }
why = "Lower bound on off-road trail attachment reach."

[[sensitivity.runs]]
name = "connector_40m"
set = { "conflation.connector_max_m" = 40.0 }
why = "Tests whether trail connectivity is an artifact of the radius."
