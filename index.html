<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  No maximum-scale, no user-scalable=no. The previous build of this page set
  both, which disables pinch-zoom -- on a map. That is a WCAG 1.4.4 failure and
  it never did anything useful: MapLibre handles pinch itself, so all the flag
  achieved was preventing people from zooming the interface.
-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lexington Bike Stress Map — how comfortable is each street to ride?</title>
<meta name="description" content="A street-by-street comfort rating for cycling in Lexington, Kentucky. About 1,248 miles are ridable for a confident rider, but the 947 miles comfortable for an ordinary adult are split into 936 disconnected islands.">
<meta name="theme-color" content="#f7f7f5">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">

<meta property="og:type" content="website">
<meta property="og:title" content="Lexington Bike Stress Map">
<meta property="og:description" content="947 miles of Lexington are comfortable to bike on. They are split into 936 disconnected islands, and the largest holds 19%.">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="./assets/vendor/maplibre-gl-5.24.0.css">
<link rel="stylesheet" href="./assets/app.css">
</head>
<body>

<a class="skip-link" href="#panel">Skip the map — browse streets as a list</a>

<div id="map" tabindex="0" role="application"
     aria-label="Map of Lexington streets coloured by how comfortable they are to bike on. Use arrow keys to pan and plus or minus to zoom, or use the skip link to browse streets as a list instead."></div>

<div id="loading" class="loading" role="status">
  <span class="spinner" aria-hidden="true"></span>
  <span id="loading-text">Loading the network…</span>
</div>

<aside id="panel" aria-label="Map information and controls" data-snap="half">
  <button id="sheet-handle" class="sheet-handle" aria-label="Resize panel"></button>
  <header class="panel-head">
    <button id="panel-back" class="icon-btn" hidden aria-label="Back">←</button>
    <h1 id="panel-title">Lexington Bike Stress</h1>
  </header>
  <div id="panel-body" class="panel-body" tabindex="-1"></div>
</aside>

<div id="hover-card" class="hover-card" hidden aria-hidden="true"></div>
<div id="announcer" class="visually-hidden" aria-live="polite" role="status"></div>

<noscript>
  <div class="fallback">
    <h1>Lexington Bike Stress Map</h1>
    <p>This map needs JavaScript to draw itself. The underlying data is open and
       can be downloaded directly:</p>
    <ul>
      <li><a href="./data/network.geojson">network.geojson</a> — bike facilities, trails and busy roads</li>
      <li><a href="./data/residential.geojson">residential.geojson</a> — quiet streets</li>
      <li><a href="./data/stats.json">stats.json</a> — summary figures</li>
      <li><a href="./data/methodology.json">methodology.json</a> — the rules behind the ratings</li>
    </ul>
  </div>
</noscript>

<script src="./assets/vendor/maplibre-gl-5.24.0.js"></script>

<!--
  Watchdog, in a classic script on purpose.

  A module that fails to LINK -- a missing export, typically because a browser
  is holding one cached file against a newer one after a deploy -- throws before
  any module code runs. No try/catch inside main.js can see it, and the page
  sits on a spinner forever saying nothing. This is the only place that failure
  can be caught.
-->
<script>
(function () {
  var problem = null;
  addEventListener('error', function (e) {
    if (e && e.message && !problem) problem = e.message;
  }, true);

  setTimeout(function () {
    if (window.__lexbikeBooted) return;
    var chip = document.getElementById('loading');
    if (chip) chip.setAttribute('hidden', '');
    var body = document.getElementById('panel-body');
    if (!body) return;
    var stale = /export named|is not a function|Failed to fetch dynamically/i
      .test(problem || '');
    body.innerHTML =
      '<p class="note">' + (stale
        ? 'Your browser is holding an old copy of this page. A hard refresh ' +
          'should fix it.'
        : 'The map did not finish starting.') + '</p>' +
      '<div class="share-actions"><button class="btn primary" id="hard-reload">' +
      'Reload</button></div>' +
      (problem ? '<p class="tech">' + problem.replace(/[&<>]/g, '') + '</p>' : '') +
      '<p class="tech">The data is open either way: ' +
      '<a href="./data/network.geojson">network.geojson</a>.</p>';
    var btn = document.getElementById('hard-reload');
    if (btn) btn.onclick = function () {
      // Cache-bust the document so the module graph is re-fetched too.
      location.replace(location.pathname + '?cb=' + Date.now());
    };
  }, 15000);
})();
</script>

<script type="module" src="./js/main.js?v=20260730-bike-access-roads"></script>
</body>
</html>
